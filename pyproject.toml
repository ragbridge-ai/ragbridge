[project]
name = "ragbridge"
version = "0.0.1"
description = "RAG-ready service that lets existing applications add chat and smart search over their own data"
readme = "README.md"
authors = [
    { name = "Amir Shadanfar" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "migrations"]
