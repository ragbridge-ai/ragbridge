services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragbridge
      POSTGRES_PASSWORD: ragbridge
      POSTGRES_DB: ragbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbridge -d ragbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Docker network, services are reachable by name, not
      # localhost. Ollama is expected to keep running directly on the
      # host (not in Compose), so it needs the Docker-for-host address
      # instead of the container's own localhost.
      DATABASE_URL: postgresql+psycopg://ragbridge:ragbridge@postgres:5432/ragbridge
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["arq", "ragbridge.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ragbridge:ragbridge@postgres:5432/ragbridge
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
