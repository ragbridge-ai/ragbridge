services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragbridge
      POSTGRES_PASSWORD: ragbridge
      POSTGRES_DB: ragbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbridge -d ragbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
